<title>Exam Room Finder</title>
<style>
:root{--bg:#faf5f5;--card:#fff;--tx:#2a1c1d;--mu:#7a6668;--pr:#b11016;--bd:#eadcdc;--ok:#fbeeee;--okt:#7d0d11;--er:#fff4e0;--ert:#8a4b00;--hl:#fff1c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171112;--card:#221819;--tx:#f3eaea;--mu:#b9a5a7;--pr:#d9434a;--bd:#3a2a2c;--ok:#3a1a1c;--okt:#ffb8bb;--er:#3a2e15;--ert:#ffd28a;--hl:#3a3315}}
:root[data-theme="dark"]{--bg:#171112;--card:#221819;--tx:#f3eaea;--mu:#b9a5a7;--pr:#d9434a;--bd:#3a2a2c;--ok:#3a1a1c;--okt:#ffb8bb;--er:#3a2e15;--ert:#ffd28a;--hl:#3a3315}
*{box-sizing:border-box}
body{margin:0;border-top:5px solid var(--pr);background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:16px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.4rem;margin:6px 0 2px}h2{font-size:1.05rem;margin:0 0 10px}
.s{color:var(--mu);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:56px;height:56px;border-radius:10px;flex:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.lang{display:flex;gap:6px}
button,select,input{font:inherit}
.lang button,.nav button{padding:6px 12px;font-size:.85rem;background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.lang button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto;border:0;border-radius:10px;padding:11px 18px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
.ex{border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--ok);color:var(--okt)}
.ex .h{font-weight:700}.ex .r{font-size:1.5rem;font-weight:700}.ex .m{font-size:.88rem}
.er{background:var(--er);color:var(--ert);border-radius:12px;padding:12px;margin-top:10px}
.warn{background:var(--hl);color:var(--tx);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem}

.nav b{font-size:.95rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:90px;font-size:.8rem}
.day.t{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
.day.o{opacity:.45}
.day .d{font-weight:700;margin-bottom:6px;color:var(--mu)}
.chip{background:var(--bg);border-left:3px solid var(--pr);border-radius:6px;padding:4px 6px;margin-bottom:5px}
.chip b{display:block}.chip span{color:var(--mu);font-size:.75rem}
.tl{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}.tl:first-child{border-top:0}
.tl span{color:var(--mu);font-size:.85rem}
@media (max-width:720px){.grid{grid-template-columns:1fr}.day.o:empty,.day.e{display:none}}
</style>

 $("h1").textContent=t.h1;$("sub").textContent=term.name;$("hFind").textContent=t.find;$("hToday").textContent=t.today;$("hWeek").textContent=t.week;
 $("sid").placeholder=t.ph;$("go").textContent=t.go;$("flt").placeholder=t.flt;$("pw").textContent=t.prev;$("nw").textContent=t.next;
 $("en").className=L==="en"?"on":"";$("th").className=L==="th"?"on":"";
 renderToday();renderWeek();if($("sid").value.trim())find();
}
function setL(l){L=l;try{localStorage.setItem("examlang",l)}catch(e){}apply()}
$("en").onclick=()=>setL("en");$("th").onclick=()=>setL("th");
$("go").onclick=find;$("sid").addEventListener("keydown",e=>{if(e.key==="Enter")find()});
$("flt").oninput=renderWeek;
$("pw").onclick=()=>{wk--;renderWeek()};$("nw").onclick=()=>{wk++;renderWeek()};
wk=curWeek();apply();
</script>
