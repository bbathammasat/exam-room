<title>Exam Room Finder</title>
<style>
:root{--bg:#faf5f5;--card:#fff;--tx:#2a1c1d;--mu:#7a6668;--pr:#b11016;--bd:#eadcdc;--ok:#fbeeee;--okt:#7d0d11;--er:#fff4e0;--ert:#8a4b00;--hl:#fff1c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171112;--card:#221819;--tx:#f3eaea;--mu:#b9a5a7;--pr:#d9434a;--bd:#3a2a2c;--ok:#3a1a1c;--okt:#ffb8bb;--er:#3a2e15;--ert:#ffd28a;--hl:#3a3315}}
:root[data-theme="dark"]{--bg:#171112;--card:#221819;--tx:#f3eaea;--mu:#b9a5a7;--pr:#d9434a;--bd:#3a2a2c;--ok:#3a1a1c;--okt:#ffb8bb;--er:#3a2e15;--ert:#ffd28a;--hl:#3a3315}
*{box-sizing:border-box}
body{margin:0;border-top:5px solid var(--pr);background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;padding:16px}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:1.4rem;margin:6px 0 2px}h2{font-size:1.05rem;margin:0 0 10px}
.s{color:var(--mu);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}.logo{width:56px;height:56px;border-radius:10px;flex:none}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.lang{display:flex;gap:6px}
button,select,input{font:inherit}
.lang button,.nav button{padding:6px 12px;font-size:.85rem;background:transparent;color:var(--mu);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.lang button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}.row>button{flex:0 0 auto;border:0;border-radius:10px;padding:11px 18px;background:var(--pr);color:#fff;font-weight:600;cursor:pointer}
.ex{border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--ok);color:var(--okt)}
.ex .h{font-weight:700}.ex .r{font-size:1.5rem;font-weight:700}.ex .m{font-size:.88rem}
.er{background:var(--er);color:var(--ert);border-radius:12px;padding:12px;margin-top:10px}
.warn{background:var(--hl);color:var(--tx);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav b{font-size:.95rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:90px;font-size:.8rem}
.day.t{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
.day.o{opacity:.45}
.day .d{font-weight:700;margin-bottom:6px;color:var(--mu)}
.chip{background:var(--bg);border-left:3px solid var(--pr);border-radius:6px;padding:4px 6px;margin-bottom:5px}
.chip b{display:block}.chip span{color:var(--mu);font-size:.75rem}
.tl{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}.tl:first-child{border-top:0}
.tl span{color:var(--mu);font-size:.85rem}
@media (max-width:720px){.grid{grid-template-columns:1fr}.day.o:empty,.day.e{display:none}}
</style>

 if(!/^\d{10}$/.test(id)){r.innerHTML=`<div class="er">${t.bad}</div>`;return}

}

function renderToday(){

 let h=`<p class="s">${fd(todayISO,{weekday:"long",day:"numeric",month:"long",year:"numeric"})} · ${t.range}: ${fd(term.start,{day:"numeric",month:"short"})} – ${fd(term.end,{day:"numeric",month:"short",year:"numeric"})}</p>`;
 if(es.length)h+=list(es);else{h+=`<p>${t.none}</p>`;const nx=term.exams.map(e=>e.date).filter(d=>d>todayISO).sort()[0];if(nx)h+=`<p class="s">${t.nextd}${fd(nx,{weekday:"long",day:"numeric",month:"long"})}</p>`}
 $("today").innerHTML=h;
}
function renderWeek(){
 const t=T[L],w=weeks(),s=w[wk],f=$("flt").value.trim().toUpperCase();

  const es=term.exams.filter(e=>e.date===d&&(!f||e.code.toUpperCase().includes(f)));
  h+=`<div class="day${d===todayISO?" t":""}${out?" o":""}${es.length?"":" e"}"><div class="d">${fd(d,{weekday:"short",day:"numeric",month:"short"})}</div>${es.map(e=>`<div class="chip"><b>${e.code}</b><span>${e.start}–${e.end} · ${t.rooms} ${roomsOf(e)}</span></div>`).join("")}</div>`}
 $("grid").innerHTML=h;
}
function apply(){
 const t=T[L];document.documentElement.lang=L;

 renderToday();renderWeek();if($("sid").value.trim())find();
}

/* Pure parser: files=[{name,sheets:[{title,rows:[[cell,...]]}]}] -> {term,report} */
function parseFiles(files,opt){
 const MON={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
 const DRE=/Date:\s*(\w+)\s*,\s*(\w+)\s+(\d+)\s*,\s*(\d{4})\s+Time:\s*(\d+:\d+)\s*-\s*(\d+:\d+)\s+Exam Room#\s*(\S+)/i;
 const iso=(y,m,d)=>y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
 const wdOf=s=>new Date(s+"T00:00:00Z").toLocaleDateString("en-US",{weekday:"long",timeZone:"UTC"});
 const mn=t=>+t.slice(0,t.indexOf(":"))*60+ +t.slice(t.indexOf(":")+1);
 const pad=t=>t.length<5?"0"+t:t;
 const mask=(cells,mode)=>{
  if(mode==="none")return "";
  const p=cells.filter(x=>x!=null&&String(x).trim()).join(" ").split(/\s+/).filter(x=>x&&x!=="-");
  if(!p.length)return "";
  if(mode==="full")return p.join(" ");
  const ti=/^(mr|mrs|miss|ms)$/i.test(p[0].replace(/\.$/,""))&&p.length>1?1:0;
  const t=p.slice(0,ti).map(x=>/^mr$/i.test(x.replace(/\.$/,""))?"Mr":/^ms$/i.test(x.replace(/\.$/,""))?"Ms":/^mrs$/i.test(x.replace(/\.$/,""))?"Mrs":/^miss$/i.test(x.replace(/\.$/,""))?"Miss":x);
  return t.concat(p.slice(ti,ti+1),p.slice(ti+1).map(x=>x[0]+".")).join(" ");
 };
 const rep=[],ex={};let nfiles=0;
 for(const f of files){
  nfiles++;
  const code=f.name.split("/").pop().replace(/\.xlsx$/i,"").replace(/^\d+-\d{4}-/,"").trim().replace(/(\s*\(\d+\)|-edit)+$/i,"");
  let found=false;
  for(const sh of f.sheets){
   let cur=null,hdr=null,title="";const blocks={};
   for(const r of sh.rows){
    const c0=r[0];
    if(typeof c0==="string"){
     const t=c0.replace(/\u00a0/g," ").trim();
     const m=DRE.exec(t);
     if(m){
      const date=iso(+m[4],MON[m[2].toLowerCase()],+m[3]);
      cur={date,t1:pad(m[5]),t2:pad(m[6]),room:m[7]};hdr=null;
      if(wdOf(date).toLowerCase()!==m[1].toLowerCase())rep.push(["warn",code+": weekday mismatch — file says \""+m[1]+"\" but "+date+" is a "+wdOf(date)]);
      blocks[JSON.stringify(cur)]=blocks[JSON.stringify(cur)]||[];continue;
     }
     if(/^[A-Z]{2}\d{3}/.test(t)&&!title){title=t;continue}
     if(r.some(c=>typeof c==="string"&&/student id/i.test(c))){hdr=r.map(c=>String(c==null?"":c).trim().toLowerCase());continue}
    }
    if(cur&&hdr){
     const ii=hdr.findIndex(h=>h.startsWith("student id"));if(ii<0)continue;
     let v=r[ii];if(typeof v==="string"&&/^\d{10}$/.test(v.trim()))v=+v.trim();
     if(typeof v!=="number")continue;
     blocks[JSON.stringify(cur)].push([String(Math.round(v)),mask(r.slice(ii+1,ii+3),opt.names)]);
    }
   }
   for(const k of Object.keys(blocks)){
    const b=JSON.parse(k),rs=blocks[k];found=true;if(!rs.length)continue;
    if(b.date<opt.start||b.date>opt.end){rep.push(["warn","EXCLUDED "+code+" room "+b.room+" ("+b.date+"): outside the term period ("+rs.length+" students)"]);continue}
    const key=code+"|"+b.date+"|"+b.t1;
    const x=ex[key]=ex[key]||{code,title,date:b.date,start:b.t1,end:b.t2,rooms:{}};
    (x.rooms[b.room]=x.rooms[b.room]||[]).push(...rs);
   }
  }
  if(!found)rep.push(["warn","NO DATA found in "+f.name]);
 }
 const exams=Object.values(ex).sort((a,b)=>(a.date+a.start+a.code).localeCompare(b.date+b.start+b.code));
 const by={},occ={};let n=0;
 for(const e of exams){
  const ids=[];
  e.rooms=Object.fromEntries(Object.keys(e.rooms).sort().map(k=>[k,e.rooms[k].map(r=>opt.names==="none"?r[0]:r)]));
  for(const [rm,rs] of Object.entries(e.rooms)){
   for(const r of rs){const id=Array.isArray(r)?r[0]:r;ids.push(id);n++;(by[id]=by[id]||[]).push(e)}
   (occ[e.date+"|"+rm]=occ[e.date+"|"+rm]||[]).push(e);
  }
  const d=ids.length-new Set(ids).size;if(d)rep.push(["warn",e.code+": "+d+" duplicate student ID(s)"]);
  const bad=ids.filter(i=>i.length!==10);if(bad.length)rep.push(["warn",e.code+": non-10-digit IDs, e.g. "+bad[0]]);
 }
 for(const [k,v] of Object.entries(occ))for(let a=0;a<v.length;a++)for(let b=a+1;b<v.length;b++)
  if(mn(v[a].start)<mn(v[b].end)&&mn(v[b].start)<mn(v[a].end))rep.push(["warn","Room "+k.split("|")[1]+" on "+k.split("|")[0]+" is used by both "+v[a].code+" and "+v[b].code+" at overlapping times"]);
 let clash=0;
 for(const [id,l] of Object.entries(by))for(let a=0;a<l.length;a++)for(let b=a+1;b<l.length;b++)
  if(l[a].date===l[b].date&&mn(l[a].start)<mn(l[b].end)&&mn(l[b].start)<mn(l[a].end)){clash++;if(clash<=5)rep.push(["warn","Time clash: "+id.slice(0,4)+"****** has "+l[a].code+" and "+l[b].code+" on "+l[a].date])}
 if(clash>5)rep.push(["warn","…and "+(clash-5)+" more time clashes"]);
 const t=exams.map(e=>e.title).filter(x=>!x).length;if(t)rep.push(["warn",t+" exam(s) have no subject title"]);
 rep.unshift(["info",nfiles+" files · "+exams.length+" exams · "+n+" records · "+Object.keys(by).length+" students"]);
 return {term:{name:opt.name,start:opt.start,end:opt.end,exams},report:rep};
}

  }
  if(!files.length){R.textContent="No .xlsx files found in the ZIP.";return}
  pending=parseFiles(files,{name:A("aName").value.trim(),start:A("aS").value,end:A("aE").value,names:A("aN").value});
  const w=pending.report.filter(r=>r[0]==="warn").length;
  R.innerHTML=pending.report.map(r=>`<div style="padding:4px 0;color:${r[0]==="warn"?"var(--ert)":"var(--okt)"}">${r[0]==="warn"?"⚠ ":"✔ "}${esc(r[1])}</div>`).join("")+`<div class="s" style="margin-top:6px">${w?w+" warning(s) — fix the source files and re-read, or continue if they are expected.":"No issues found."}</div>`;
  A("aPv").disabled=A("aDl").disabled=!pending.term.exams.length;
 }catch(e){R.textContent="Error: "+e.message}
};
function nextTerms(){return A("aK").checked?TERMS.filter(t=>t.name!==pending.term.name).concat(pending.term):[pending.term]}
A("aPv").onclick=()=>{TERMS=nextTerms();term=pending.term;termUI();wk=curWeek();build();apply();scrollTo({top:0,behavior:"smooth"})};
A("aDl").onclick=async()=>{
 const json=JSON.stringify(nextTerms()).replace(/<\//g,"<\\/");
 const html=SRC.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
 const blob=new Blob([html],{type:"text/html"});
 let d=null;try{d=typeof claude!=="undefined"?await claude.use("downloads"):null}catch(e){}
 if(d){try{await d.save({filename:"index.html",data:blob})}catch(e){}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";document.body.appendChild(a);a.click();a.remove();
};
termUI();
wk=curWeek();apply();
</script>
</body>
</html>
